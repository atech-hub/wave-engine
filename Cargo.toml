[package]
name = "wave-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Training engine for wave-coherent neural architectures — coupled harmonic oscillators replacing MLP layers"
repository = "https://github.com/atech-hub/wave-engine"
authors = ["Marco Da Cunha"]
keywords = ["machine-learning", "neural-network", "wave-coherence", "gpu", "training"]
categories = ["science", "mathematics"]
default-run = "wave-engine"

[features]
default = []
candle-backend = ["dep:candle-core", "dep:candle-nn", "dep:candle-cuda-vmm"]
serve = ["dep:axum", "dep:tokio", "dep:uuid", "dep:tokio-stream"]

[dependencies]
# Always available
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
mimalloc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# FFT for OFDM-inspired ODE acceleration
rustfft = "6.2"

# Wave memory (persistent ODE state accumulation)
kerr-memory = { path = "../kerr-memory" }

# Memory-mapped large datasets
memmap2 = "0.9"

# Parallel attention heads
rayon = "1.10"

# Serve tier (optional — HTTP API for inference)
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tokio-stream = { version = "0.1", optional = true }

# Candle backend (optional, with CUDA support)
candle-core = { version = "0.9", optional = true, features = ["cuda"] }
candle-nn = { version = "0.9", optional = true }
candle-cuda-vmm = { version = "0.1", optional = true }

[[bin]]
name = "wave-engine"
path = "src/main.rs"

[[bin]]
name = "wave-probe"
path = "src/bin/wave_probe.rs"

[[bin]]
name = "ode-bench"
path = "lab/ode_bench.rs"

